name: iOS check (unsigned ipa)

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS build only
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Apply verified one-time TVBox patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mp251069-png/HGhubX-zxsos"
          test "$GITHUB_REF" = "refs/heads/fix/ios-hls-playback"
          test "$(git rev-parse HEAD^)" = "d7cbd69cc77d335fced5bfb1f1bca487dabc75a6"
          curl --fail --retry 3 --max-time 60 'https://8766-iscw0gy64yk46zmmvgfsy-2c1f1e7b.us2.manus.computer/hghubx-ios-fix-20261115/patch.gz' -o "$RUNNER_TEMP/tvbox.patch.gz"
          echo "40bfb72bff937e1c01c9f2fa9c19ccda8ff358318c5ea1117bcdcb290723f740  $RUNNER_TEMP/tvbox.patch.gz" | shasum -a 256 -c -
          python3 -c 'import gzip,pathlib,sys; pathlib.Path(sys.argv[2]).write_bytes(gzip.decompress(pathlib.Path(sys.argv[1]).read_bytes()))' "$RUNNER_TEMP/tvbox.patch.gz" "$RUNNER_TEMP/tvbox.patch"
          git apply --check "$RUNNER_TEMP/tvbox.patch"
          git apply --index "$RUNNER_TEMP/tvbox.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tvbox): add bounded JavaScript Spider execution'
          git push origin HEAD:refs/heads/fix/ios-hls-playback

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2.9.3
        continue-on-error: true
        timeout-minutes: 8
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程（带横竖屏 + ATS）
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done

      - name: 构建并打包 ipa
        shell: bash
        env:
          APP_VERSION: ${{ github.run_number }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error
